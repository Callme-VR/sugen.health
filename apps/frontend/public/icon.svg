<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="sugen-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="sugen-pulse" x1="12" y1="32" x2="52" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e575"/>
      <stop offset="55%" stop-color="#00b24b"/>
      <stop offset="100%" stop-color="#0075ff"/>
    </linearGradient>
    <filter id="sugen-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Rounded Squircle Base -->
  <rect width="60" height="60" x="2" y="2" rx="15" fill="url(#sugen-bg)"/>
  <rect width="60" height="60" x="2" y="2" rx="15" stroke="#00b24b" stroke-opacity="0.35" stroke-width="1.5" fill="none"/>

  <!-- Subtle Medical Cross Structure in Background -->
  <path d="M26 14h12a3 3 0 0 1 3 3v9h9a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3h-9v9a3 3 0 0 1-3 3H26a3 3 0 0 1-3-3v-9h-9a3 3 0 0 1-3-3v-6a3 3 0 0 1 3-3h9v-9a3 3 0 0 1 3-3z" 
        fill="#101c30" 
        stroke="#1d3254" 
        stroke-width="1.2"/>

  <!-- High-Precision Clinical ECG Pulse Wave -->
  <path d="M13 32h10l3.5-3.5 4.5 14 5-23 4.5 16 3-3.5h7.5" 
        stroke="url(#sugen-pulse)" 
        stroke-width="3.2" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#sugen-glow)"/>

  <!-- Peak Diagnostic Indicator -->
  <circle cx="36" cy="16.5" r="2.2" fill="#ffffff" filter="url(#sugen-glow)"/>
</svg>

